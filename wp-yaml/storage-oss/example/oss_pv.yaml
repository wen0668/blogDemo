# 参考https://help.aliyun.com/zh/ack/ack-managed-and-ack-dedicated/user-guide/mount-statically-provisioned-oss-volumes?spm=a2c4g.11186623.0.0.10a658ebHrtsKP#title-hos-c75-12q
#参照文档: https://help.aliyun.com/zh/eci/user-guide/mount-an-oss-bucket-as-a-volume-1
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wpsix-oss-pv
  labels:
    alicloud-pvname: wpsix-oss-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ossplugin.csi.alibabacloud.com
    # set volumeHandle same value pv name
    volumeHandle: wpsix-oss-pv
    nodePublishSecretRef:
      name: csi-access-key
      namespace: wpsix
    volumeAttributes:
      bucket: "wordpress-posts-image"
      url: "oss-cn-beijing.aliyuncs.com"
      ramRole: "RamOssTest"
      otherOpts: "-o max_stat_cache_size=0 -o uid=1000 -o gid=1000 -o allow_other"
      path: "/uploads"